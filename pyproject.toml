[project]
name = "renovai"
version = "0.1.0"
description = "A tool for Hungarian apartment buyers to estimate renovation costs and get pre-purchase advice."
requires-python = ">=3.11"
dependencies = [
    "openpyxl",
    "pandas",
    "streamlit>=1.35.0",
    "chromadb",
    "google-generativeai",
    "langchain",
    "langchain-google-genai",
    "scikit-learn",
    "fastapi",
    "pydantic>=2.0",
    "pydantic-settings",
    "uvicorn",
    "python-dotenv",
    "rich",
    "joblib",
    "tabpfn",
    "tiktoken",
    "langchain-community",
    "rank-bm25",
    "sqlalchemy>=2.0",
    "alembic",
    "aiosqlite",
    "mcp",
    "tenacity",
    "diskcache",
    "openai>=1.0.0",
    "google-cloud-aiplatform[agent-engines]>=1.148.1",
    "google-adk>=2.1.0",
    "google-cloud-logging>=3.16.0",
]

[project.optional-dependencies]
adk = ["google-adk"]
test = ["pytest>=9.0", "pytest-asyncio"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["renovai*", "sandbox*", "orchestrator*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
