[project]
name = "renovai"
version = "0.1.0"
description = "A tool for Hungarian apartment buyers to estimate renovation costs and get pre-purchase advice."
requires-python = ">=3.11"
dependencies = [
    "openpyxl",
    "pandas",
    "chromadb",
    "google-generativeai",
    "langchain",
    "langchain-google-genai",
    "scikit-learn",
    "fastapi",
    "pydantic>=2.0",
    "pydantic-settings",
    "uvicorn",
    "python-dotenv",
    "rich",
    "joblib",
    "tabpfn",
    "tiktoken",
    "langchain-community",
    "rank-bm25",
    "sqlalchemy>=2.0",
    "alembic",
    "aiosqlite",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["renovai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
