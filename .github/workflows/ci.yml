name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          # pyproject.toml declares >=3.11; use the minimum supported version
          # so this job exercises the repository's declared compatibility floor.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio ruff mypy

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Mypy
        continue-on-error: true
        # Mypy is intentionally non-blocking during brownfield adoption. Make
        # this blocking after the existing findings are triaged and cleared.
        run: python -m mypy .

      - name: Pytest
        run: python -m pytest -q
